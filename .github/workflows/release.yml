name: Release

# A tag vX.Y.Z builds, tests and attaches every module's jar, sources, javadoc, POM and Gradle Module Metadata (.module,
# which carries the dependencies) to the GitHub Release vX.Y.Z, plus SHA256SUMS. Consumers resolve them anonymously
# with an Ivy repository on https://github.com/mafischer/kotlin2rtc/releases/download (README "Installation").
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the release and upload its files
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true # a release never writes the shared build cache

      - name: Version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "tag $GITHUB_REF_NAME is not vX.Y.Z" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The same checks as CI (tests, ktlint, API dump, coverage minimums), then the publication into a local repository
      - name: Build and publish locally
        run: |
          ./gradlew build publishAllPublicationsToGithubReleaseRepository \
            -PVERSION_NAME=${{ steps.version.outputs.version }} --no-build-cache --stacktrace

      - name: Collect the release files
        run: |
          mkdir dist
          find build/github-release-repo -path "*/${{ steps.version.outputs.version }}/*" -type f \
            ! -name '*.md5' ! -name '*.sha1' ! -name '*.sha256' ! -name '*.sha512' -exec cp {} dist/ \;
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          [[ "${{ steps.version.outputs.version }}" == *-* || "${{ steps.version.outputs.version }}" == 0.* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* --title "kotlin2rtc ${{ steps.version.outputs.version }}" --generate-notes --verify-tag $prerelease
