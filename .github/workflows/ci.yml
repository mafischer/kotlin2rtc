name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # Compile, tests, ktlint, the public API check (api/*.api) and the aggregated Kover report
      - name: Build
        run: ./gradlew build --stacktrace

      # Line and branch coverage of the aggregated Kover report on the run's summary (`build` already failed below the
      # minimums in build.gradle.kts)
      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          root = ET.parse("build/reports/kover/report.xml").getroot()
          print("| Coverage | % |\n|---|---|")
          for counter in root.findall("counter"):
              if counter.get("type") in ("LINE", "BRANCH", "INSTRUCTION"):
                  missed, covered = int(counter.get("missed")), int(counter.get("covered"))
                  print(f"| {counter.get('type').title()} | {100 * covered / (missed + covered):.1f} |")
          PY

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/reports/ktlint/
            build/reports/kover/
          if-no-files-found: ignore

  # Dependencies (the gradle.lockfile of every module), secrets and misconfigurations: fails on any secret and on
  # CRITICAL/HIGH vulnerabilities with a fixed version; accept a risk only in .trivyignore.yaml with a reason and expiry
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Trivy (blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: build,.gradle

      - name: Trivy (everything, for the log)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          exit-code: "0"
          skip-dirs: build,.gradle
          skip-setup-trivy: true
